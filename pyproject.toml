[project]
name = "portfolio-analyzer"
version = "0.1.0"
description = "Personal decision-support tool for allocating a monthly SIP across Indian mutual funds"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "duckdb>=1.0,<2",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "requests>=2.31,<3",
    "python-dateutil>=2.8,<3",
    "click>=8.1,<9",
    "pyyaml>=6.0,<7",
]

[project.scripts]
ingest = "ingest.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingest", "xirr", "asof", "backtest"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
